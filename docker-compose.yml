services:
  db:
    image: postgres:16-alpine
    container_name: darkguard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darkguard
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: darkguard_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}@db:5432/app_db
    networks:
      - darkguard

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darkguard_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}@db:5432/app_db
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - darkguard
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  postgres_data:

networks:
  darkguard:
    driver: bridge
